---
name: project-lint
# Linter specific to current project.
# This workflow checks for uncommitted changes after running 'make generate'.
# It is used to ensure that the relevant generated files are committed to the repository.
on:
  workflow_call:
    inputs:
      runs_on:
        required: true
        type: string
      continue_on_error:
        required: true
        type: boolean
      timeout_minutes:
        required: false
        type: number
        default: 10
permissions: {}
jobs:
  project-lint:
    name: project-lint
    runs-on: ${{ inputs.runs_on }}
    continue-on-error: ${{ inputs.continue_on_error }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: read
    # -----
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # -----
      - name: 'Extract Go version'
        id: go-version
        run: echo "version=$(grep '^go ' go.mod | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - name: 'Setup Go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
          cache-dependency-path: |
            **/go.sum
            **/go.mod
      # -----
      - name: 'Download Go modules'
        run: go mod tidy && go mod download
      # -----
      - name: 'Cache Homebrew and formulae'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /home/linuxbrew/.linuxbrew
            /home/linuxbrew/.cache/Homebrew
          key: homebrew-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Makefile') }}
          restore-keys: |
            homebrew-${{ runner.os }}-${{ runner.arch }}-
            homebrew-${{ runner.os }}-
      # -----
      - name: 'Setup Homebrew'
        uses: Homebrew/actions/setup-homebrew@f8d4222eb633e65c2a0157383cf80861fc7fae7f # main
      # -----
      - name: 'Run setup and generate'
        run: |
          make setup
          make generate
      - name: 'Check for uncommitted changes'
        run: |-
          if [[ -n $(git status --porcelain) ]]; then
            echo "❌ Uncommitted changes detected after running 'make generate'"
            echo "The following files have changes:"
            git status --porcelain
            echo ""
            echo "Please run 'make setup && make generate' locally and commit the changes."
            exit 1
          else
            echo "✅ No uncommitted changes detected"
          fi
