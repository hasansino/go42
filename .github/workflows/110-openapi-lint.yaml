---

name: openapi-lint

# OpenAPI linter.
# @see https://redocly.com/docs/cli

on:
  workflow_dispatch:
    inputs:
      runs_on:
        required: true
        type: string
        default: ubuntu-latest
        description: 'runs_on'
      continue_on_error:
        required: true
        type: boolean
        default: false
        description: 'continue_on_error'
      timeout_minutes:
        required: false
        type: number
        default: 10
        description: 'timeout_minutes'
  workflow_call:
    inputs:
      runs_on:
        required: true
        type: string
      continue_on_error:
        required: true
        type: boolean
      timeout_minutes:
        required: false
        type: number
        default: 10

permissions: {}

jobs:
  openapi-lint:
    name: openapi-lint
    runs-on: ${{ inputs.runs_on }}
    continue-on-error: ${{ inputs.continue_on_error }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: read
    # ----
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@v7
      - name: 'Run redocly OpenAPI linter'
        run: |-
          docker run --rm \
            -v "${{ github.workspace }}:/workdir" \
            -w /workdir \
            ghcr.io/redocly/cli:latest \
            lint --config etc/redocly.yaml --format github-actions api/openapi/**/*.yaml
