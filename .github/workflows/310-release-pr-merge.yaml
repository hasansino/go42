---

name: release

# Revalidate a merged release PR, build and test its exact merge commit, then
# publish the container image, immutable Git tag, and GitHub Release. The Git
# tag is created only after image verification, so it is the deployment signal.

on:
  pull_request:
    branches:
      - master
    paths:
      - 'infra/helm/app/Chart.yaml'
    types:
      - closed

permissions: {}

concurrency:
  # Only release PRs share the serialized queue. Unrelated closed PR events
  # finish independently instead of occupying a release queue entry.
  group: >-
    ${{ github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'master' && github.event.pull_request.head.repo.full_name
    == github.repository && github.event.pull_request.user.login == format('{0}[bot]', vars.RELEASE_APP_NAME) && startsWith(github.event.pull_request.head.ref,
    'auto-release-v') && 'release' || format('release-not-applicable-{0}', github.run_id) }}
  queue: max
  cancel-in-progress: false

jobs:
  validate-release:
    name: validate-release
    if: |
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'master' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'auto-release-v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      pull-requests: read
      statuses: read
    outputs:
      already_released: ${{ steps.validate-source.outputs.already_released }}
      head_sha: ${{ steps.validate-pr.outputs.head_sha }}
      is_prerelease: ${{ steps.validate-source.outputs.is_prerelease }}
      previous_tag: ${{ steps.validate-source.outputs.previous_tag }}
      release_tag: ${{ steps.validate-pr.outputs.release_tag }}
      source_sha: ${{ steps.validate-pr.outputs.merge_sha }}
      tag_exists: ${{ steps.validate-source.outputs.tag_exists }}
    steps:
      - name: 'Validate merged release pull request'
        id: validate-pr
        env:
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          EVENT_RUN_SHA: ${{ github.sha }}
          EVENT_WORKFLOW_SHA: ${{ github.workflow_sha }}
          EXPECTED_APP_SLUG: ${{ vars.RELEASE_APP_NAME }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail
          semver_pattern='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?$'

          if [[ ! "$EXPECTED_APP_SLUG" =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
            echo "RELEASE_APP_NAME must contain the expected GitHub App slug" >&2
            exit 1
          fi
          if [[ ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "Pull request number is invalid" >&2
            exit 1
          fi

          pull_request="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}")"
          head_branch="$(jq -r '.head.ref' <<< "$pull_request")"
          release_tag="${head_branch#auto-release-}"
          expected_title="Release ${release_tag}"

          if [[ "$head_branch" != "auto-release-${release_tag}" || \
            ! "$release_tag" =~ $semver_pattern || ${#release_tag} -gt 128 ]]; then
            echo "Release branch does not contain a strict SemVer version" >&2
            exit 1
          fi

          if ! jq -e \
            --arg author "${EXPECTED_APP_SLUG}[bot]" \
            --arg branch "$head_branch" \
            --arg repository "$REPOSITORY" \
            --arg title "$expected_title" \
            '.state == "closed"
              and .merged == true
              and .title == $title
              and .base.ref == "master"
              and .base.repo.full_name == $repository
              and .head.ref == $branch
              and .head.repo.full_name == $repository
              and .user.login == $author
              and .changed_files == 1
              and .commits == 1
              and (.head.sha | test("^[0-9a-f]{40}$"))
              and (.merge_commit_sha | test("^[0-9a-f]{40}$"))' \
            <<< "$pull_request" >/dev/null; then
            echo "Merged pull request does not match the release identity" >&2
            exit 1
          fi

          head_sha="$(jq -r '.head.sha' <<< "$pull_request")"
          merge_sha="$(jq -r '.merge_commit_sha' <<< "$pull_request")"
          if [[ "$head_sha" != "$EVENT_HEAD_SHA" || "$merge_sha" != "$EVENT_MERGE_SHA" ]]; then
            echo "Pull request API state differs from the closed event" >&2
            exit 1
          fi
          if [[ "$merge_sha" != "$EVENT_RUN_SHA" ]]; then
            echo "Workflow run does not identify the exact release merge commit" >&2
            exit 1
          fi
          if [[ "$merge_sha" != "$EVENT_WORKFLOW_SHA" ]]; then
            echo "Workflow definition does not come from the exact release merge commit" >&2
            exit 1
          fi

          changed_files="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100")"
          if ! jq -e --arg chart 'infra/helm/app/Chart.yaml' '
            length == 1
              and .[0].filename == $chart
              and .[0].status == "modified"
              and .[0].additions == 1
              and .[0].deletions == 1
          ' <<< "$changed_files" >/dev/null; then
            echo "Release pull request must change one Chart.yaml line" >&2
            exit 1
          fi

          commits="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}/commits?per_page=100")"
          if ! jq -e \
            --arg author "${EXPECTED_APP_SLUG}[bot]" \
            --arg head_sha "$head_sha" \
            'length == 1
              and .[0].sha == $head_sha
              and .[0].author.login == $author
              and .[0].commit.verification.verified == true
              and (.[0].parents | length == 1)' <<< "$commits" >/dev/null; then
            echo "Release pull request must contain one verified release App commit" >&2
            exit 1
          fi

          status_pages="${RUNNER_TEMP}/release-policy-status-pages.json"
          policy_statuses="${RUNNER_TEMP}/release-policy-statuses.json"
          policy_status="${RUNNER_TEMP}/release-policy-status.json"
          gh api --paginate \
            "repos/${REPOSITORY}/commits/${head_sha}/statuses?per_page=100" > "$status_pages"
          jq -cs 'add // []' "$status_pages" > "$policy_statuses"
          jq '[.[] | select(.context == "release-policy")] | max_by(.id)' \
            "$policy_statuses" > "$policy_status"
          if ! jq -e \
            --arg description "Authorized release PR #${PR_NUMBER} validated." \
            --arg target_prefix "${SERVER_URL}/${REPOSITORY}/actions/runs/" '
              .state == "success"
                and .description == $description
                and .creator.login == "github-actions[bot]"
                and (.target_url | startswith($target_prefix))
                and (.target_url | test("/actions/runs/[0-9]+$"))
            ' "$policy_status" >/dev/null; then
            echo "The exact release commit has no successful release-policy status" >&2
            exit 1
          fi

          policy_run_url="$(jq -r '.target_url' "$policy_status")"
          policy_run_id="${policy_run_url##*/}"
          policy_run=''
          for attempt in $(seq 1 6); do
            policy_run="$(gh api "repos/${REPOSITORY}/actions/runs/${policy_run_id}")"
            [[ "$(jq -r '.status' <<< "$policy_run")" == 'completed' ]] && break
            if (( attempt < 6 )); then
              sleep 5
            fi
          done
          if ! jq -e \
            --arg repository "$REPOSITORY" \
            --argjson run_id "$policy_run_id" '
              .id == $run_id
                and .event == "pull_request_target"
                and .path == ".github/workflows/230-release-policy.yaml"
                and .status == "completed"
                and .conclusion == "success"
                and .repository.full_name == $repository
            ' <<< "$policy_run" >/dev/null; then
            echo "release-policy status does not reference a successful trusted workflow run" >&2
            exit 1
          fi

          {
            echo "head_sha=$head_sha"
            echo "merge_sha=$merge_sha"
            echo "release_tag=$release_tag"
          } >> "$GITHUB_OUTPUT"
      # ----
      - name: 'Checkout exact merge commit'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
          ref: ${{ steps.validate-pr.outputs.merge_sha }}
      # ----
      - name: 'Validate merged release source'
        id: validate-source
        env:
          EXPECTED_APP_SLUG: ${{ vars.RELEASE_APP_NAME }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ steps.validate-pr.outputs.head_sha }}
          MERGE_SHA: ${{ steps.validate-pr.outputs.merge_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RELEASE_TAG: ${{ steps.validate-pr.outputs.release_tag }}
          REPOSITORY: ${{ github.repository }}
          SEMVER_TOOL: ${{ github.workspace }}/.github/scripts/release-semver.py
        run: |
          set -euo pipefail
          chart_file='infra/helm/app/Chart.yaml'

          if [[ "$(git rev-parse HEAD)" != "$MERGE_SHA" ]]; then
            echo "Checkout did not resolve to the exact merge commit" >&2
            exit 1
          fi
          git fetch --force --no-tags origin master:refs/remotes/origin/master
          if ! git merge-base --is-ancestor "$MERGE_SHA" refs/remotes/origin/master; then
            echo "Release merge commit is not part of current master history" >&2
            exit 1
          fi

          read -r -a merge_line <<< "$(git rev-list --parents -n 1 "$MERGE_SHA")"
          if (( ${#merge_line[@]} < 2 || ${#merge_line[@]} > 3 )); then
            echo "Release result has an unexpected parent structure" >&2
            exit 1
          fi
          merge_parent="${merge_line[1]}"
          prior_app_line="$(git show "${merge_parent}:${chart_file}" | grep '^appVersion:' || true)"
          prior_version="$(sed -n 's/^appVersion: "\([^"]*\)"$/\1/p' <<< "$prior_app_line")"
          if ! python3 "$SEMVER_TOOL" newer "$RELEASE_TAG" "$prior_version"; then
            echo "Release version is not newer than the master version it replaces" >&2
            exit 1
          fi
          if ! gh api "repos/${REPOSITORY}/git/ref/tags/${prior_version}" >/dev/null || \
            ! gh api "repos/${REPOSITORY}/releases/tags/${prior_version}" >/dev/null; then
            echo "Previous Chart version is not fully published: $prior_version" >&2
            exit 1
          fi

          git fetch --no-tags origin \
            "refs/pull/${PR_NUMBER}/head:refs/remotes/pull/${PR_NUMBER}/head"
          if [[ "$(git rev-parse "refs/remotes/pull/${PR_NUMBER}/head")" != "$HEAD_SHA" ]]; then
            echo "Pull request head ref does not match the closed event" >&2
            exit 1
          fi
          read -r -a head_line <<< "$(git rev-list --parents -n 1 "$HEAD_SHA")"
          if (( ${#head_line[@]} != 2 )); then
            echo "Release App commit must have exactly one parent" >&2
            exit 1
          fi
          parent_sha="${head_line[1]}"

          changed_files="$(git diff --name-only "$parent_sha" "$HEAD_SHA")"
          if [[ "$changed_files" != "$chart_file" ]]; then
            echo "Release App commit changed files outside Chart.yaml" >&2
            printf 'Changed files:\n%s\n' "$changed_files" >&2
            exit 1
          fi
          expected_numstat=$'1\t1\tinfra/helm/app/Chart.yaml'
          actual_numstat="$(git diff --numstat "$parent_sha" "$HEAD_SHA" -- "$chart_file")"
          if [[ "$actual_numstat" != "$expected_numstat" ]]; then
            echo "Release App commit must change exactly one Chart.yaml line" >&2
            exit 1
          fi
          if [[ "$(git show "${parent_sha}:${chart_file}" | grep -c '^appVersion:')" -ne 1 || \
            "$(git show "${HEAD_SHA}:${chart_file}" | grep -c '^appVersion:')" -ne 1 ]]; then
            echo "Chart.yaml must contain one top-level appVersion before and after" >&2
            exit 1
          fi
          if ! diff -u \
            <(git show "${parent_sha}:${chart_file}" | sed '/^appVersion:/d') \
            <(git show "${HEAD_SHA}:${chart_file}" | sed '/^appVersion:/d'); then
            echo "Release App commit changed Chart.yaml outside appVersion" >&2
            exit 1
          fi
          if [[ "$(grep -c '^appVersion:' "$chart_file")" -ne 1 ]] || \
            ! grep -Fqx "appVersion: \"${RELEASE_TAG}\"" "$chart_file"; then
            echo "Merged Helm appVersion does not equal $RELEASE_TAG" >&2
            exit 1
          fi

          tag_exists=false
          if git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"; then
            tag_sha="$(git rev-list -n 1 "refs/tags/${RELEASE_TAG}")"
            if [[ "$tag_sha" != "$MERGE_SHA" ]]; then
              echo "Existing tag points to $tag_sha instead of $MERGE_SHA" >&2
              exit 1
            fi
            tag_exists=true
          fi

          release_pages="${RUNNER_TEMP}/release-validation-pages.json"
          releases_file="${RUNNER_TEMP}/release-validation-releases.json"
          gh api --paginate "repos/${REPOSITORY}/releases?per_page=100" > "$release_pages"
          jq -cs 'add // []' "$release_pages" > "$releases_file"
          releases="$(cat "$releases_file")"
          existing_release="$(jq --arg tag "$RELEASE_TAG" '[.[] | select(.tag_name == $tag)]' <<< "$releases")"
          if [[ "$(jq 'length' <<< "$existing_release")" -gt 1 ]]; then
            echo "Multiple GitHub releases use $RELEASE_TAG" >&2
            exit 1
          fi
          if [[ "$RELEASE_TAG" == *-* ]]; then
            is_prerelease=true
          else
            is_prerelease=false
          fi

          already_released=false
          if [[ "$(jq 'length' <<< "$existing_release")" -eq 1 ]]; then
            if ! jq -e \
              --arg author "${EXPECTED_APP_SLUG}[bot]" \
              --arg tag "$RELEASE_TAG" \
              --argjson prerelease "$is_prerelease" \
              '.[0].tag_name == $tag
                and .[0].name == ("Release " + $tag)
                and .[0].author.login == $author
                and .[0].draft == false
                and .[0].prerelease == $prerelease' <<< "$existing_release" >/dev/null; then
              echo "Existing GitHub release conflicts with $RELEASE_TAG" >&2
              exit 1
            fi
            if [[ "$tag_exists" != true ]]; then
              echo "GitHub release exists without the validated Git tag" >&2
              exit 1
            fi
            already_released=true
          elif [[ "$tag_exists" == true ]]; then
            echo "Git tag exists without its GitHub Release: $RELEASE_TAG" >&2
            echo "Rerun only the failed publish-release job from the original workflow run." >&2
            exit 1
          fi

          {
            echo "already_released=$already_released"
            echo "is_prerelease=$is_prerelease"
            echo "previous_tag=$prior_version"
            echo "tag_exists=$tag_exists"
          } >> "$GITHUB_OUTPUT"
      # ----
      - name: 'Validate release App configuration'
        if: steps.validate-source.outputs.already_released == 'false'
        env:
          RELEASE_APP_CLIENT_ID: ${{ vars.RELEASE_APP_CLIENT_ID }}
          RELEASE_APP_NAME: ${{ vars.RELEASE_APP_NAME }}
        run: |
          set -euo pipefail
          if [[ -z "$RELEASE_APP_CLIENT_ID" ]]; then
            echo "RELEASE_APP_CLIENT_ID must contain the GitHub App Client ID" >&2
            exit 1
          fi
          if [[ ! "$RELEASE_APP_NAME" =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
            echo "RELEASE_APP_NAME must contain the expected GitHub App slug" >&2
            exit 1
          fi
      # ----
      # Prove that the App can publish before an image is pushed. This temporary,
      # repository-scoped token is used only for read checks and revoked when the
      # job ends; the final publication job mints a fresh token.
      - name: 'Generate repository-scoped release App preflight token'
        if: steps.validate-source.outputs.already_released == 'false'
        id: release-app-preflight
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - name: 'Verify release App identity and scope'
        if: steps.validate-source.outputs.already_released == 'false'
        env:
          ACTUAL_APP_SLUG: ${{ steps.release-app-preflight.outputs.app-slug }}
          EXPECTED_APP_SLUG: ${{ vars.RELEASE_APP_NAME }}
          GH_TOKEN: ${{ steps.release-app-preflight.outputs.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$ACTUAL_APP_SLUG" != "$EXPECTED_APP_SLUG" ]]; then
            echo "Release App slug mismatch" >&2
            exit 1
          fi

          scoped_repositories="$(gh api --paginate 'installation/repositories?per_page=100' \
            --jq '.repositories[].full_name' | sort)"
          if [[ "$scoped_repositories" != "$REPOSITORY" ]]; then
            echo "Release App token is not scoped exclusively to $REPOSITORY" >&2
            printf 'Accessible repositories:\n%s\n' "$scoped_repositories" >&2
            exit 1
          fi

  docker-build:
    name: docker-build
    if: needs.validate-release.outputs.already_released == 'false'
    needs:
      - validate-release
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
      packages: write
    uses: ./.github/workflows/140-docker-build.yaml
    with:
      runs_on: ubuntu-latest
      continue_on_error: false
      service_name: "go42"
      image_tag: ${{ needs.validate-release.outputs.release_tag }}
      source_sha: ${{ needs.validate-release.outputs.source_sha }}
      platforms: "linux/amd64,linux/arm64"
      attestation: true
      generate_sbom: true
      attestation_sbom: true
      timeout_minutes: 30

  generate-summary:
    name: generate-summary
    if: needs.validate-release.outputs.already_released == 'false'
    needs:
      - validate-release
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    permissions:
      contents: read
      models: read
    outputs:
      summary: ${{ steps.ai-summary.outputs.summary }}
    env:
      SUMMARY_ENABLE: ${{ vars.SUMMARY_ENABLE }}
      SUMMARY_MODEL: ${{ vars.SUMMARY_MODEL }}
    steps:
      - name: 'Checkout exact release source'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.validate-release.outputs.source_sha }}
      - name: 'Generate AI summary'
        id: ai-summary
        uses: ./.github/actions/ai-generate-summary
        with:
          base_ref: ${{ needs.validate-release.outputs.previous_tag }}
          head_ref: ${{ needs.validate-release.outputs.release_tag }}
          target_commitish: ${{ needs.validate-release.outputs.source_sha }}
          context_type: release
          github_token: ${{ secrets.GITHUB_TOKEN }}

  integration-tests:
    name: integration-tests
    if: needs.validate-release.outputs.already_released == 'false'
    needs:
      - validate-release
      - docker-build
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/150-integration-tests.yaml
    with:
      runs_on: ubuntu-latest
      continue_on_error: false
      service_name: "go42"
      image_tag: ${{ needs.validate-release.outputs.release_tag }}
      image_reference: ghcr.io/${{ github.repository_owner }}/go42@${{ needs.docker-build.outputs.image_digest }}
      source_sha: ${{ needs.validate-release.outputs.source_sha }}
      timeout_minutes: 10

  publish-release:
    name: publish-release
    if: |
      !cancelled() &&
      needs.validate-release.result == 'success' &&
      needs.validate-release.outputs.already_released == 'false' &&
      needs.docker-build.result == 'success' &&
      needs.integration-tests.result == 'success'
    needs:
      - validate-release
      - docker-build
      - generate-summary
      - integration-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      attestations: read
      contents: read
      packages: read
    steps:
      - name: 'Set up Docker Buildx'
        uses: docker/setup-buildx-action@v4
      - name: 'Log in to GitHub Container Registry'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # ----
      - name: 'Verify image, provenance, and release run'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_DIGEST: ${{ needs.docker-build.outputs.image_digest }}
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/go42
          RELEASE_TAG: ${{ needs.validate-release.outputs.release_tag }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ needs.validate-release.outputs.source_sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != 'refs/heads/master' || "$WORKFLOW_SHA" != "$SOURCE_SHA" ]]; then
            echo "Release workflow identity is not bound to the validated merge commit" >&2
            exit 1
          fi

          image_metadata="$(docker buildx imagetools inspect \
            "${IMAGE_REPOSITORY}:${RELEASE_TAG}" --format '{{json .}}')"
          current_digest="$(jq -r '.manifest.digest // empty' <<< "$image_metadata")"
          if [[ "$current_digest" != "$IMAGE_DIGEST" ]]; then
            echo "Release tag does not point to the tested image digest" >&2
            exit 1
          fi

          attestation_file="${RUNNER_TEMP}/provenance.json"
          signer_workflow="${GITHUB_SERVER_URL#https://}/${REPOSITORY}/.github/workflows/140-docker-build.yaml"
          gh attestation verify "oci://${IMAGE_REPOSITORY}@${IMAGE_DIGEST}" \
            --repo "$REPOSITORY" \
            --signer-workflow "$signer_workflow" \
            --signer-digest "$SOURCE_SHA" \
            --source-digest "$SOURCE_SHA" \
            --source-ref 'refs/heads/master' \
            --format json > "$attestation_file"

          expected_config="${GITHUB_SERVER_URL}/${WORKFLOW_REF}"
          invocation_prefix="${GITHUB_SERVER_URL}/${REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/"
          if ! jq -e \
            --arg config "$expected_config" \
            --arg invocation_prefix "$invocation_prefix" \
            --arg source "$SOURCE_SHA" \
            'any(.[].verificationResult.signature.certificate;
              .buildConfigURI == $config
              and .buildConfigDigest == $source
              and .buildTrigger == "pull_request"
              and (.runInvocationURI | startswith($invocation_prefix))
              and (.runInvocationURI | ltrimstr($invocation_prefix) | test("^[1-9][0-9]*$")))' \
            "$attestation_file" >/dev/null; then
            echo "Provenance is not bound to this release workflow run" >&2
            exit 1
          fi
      # ----
      - name: 'Prepare release notes'
        env:
          IMAGE_DIGEST: ${{ needs.docker-build.outputs.image_digest }}
          PREVIOUS_TAG: ${{ needs.validate-release.outputs.previous_tag }}
          RELEASE_SUMMARY: ${{ needs.generate-summary.outputs.summary }}
          RELEASE_TAG: ${{ needs.validate-release.outputs.release_tag }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ needs.validate-release.outputs.source_sha }}
        run: |
          {
            echo "**Source commit:** \`${SOURCE_SHA}\`"
            echo "**Image:** \`ghcr.io/${REPOSITORY}@${IMAGE_DIGEST}\`"
            echo "**Release workflow:** ${GITHUB_SERVER_URL}/${REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            if [[ -n "$PREVIOUS_TAG" ]]; then
              echo "**Previous version:** \`${PREVIOUS_TAG}\`"
              echo "**Full changelog:** ${GITHUB_SERVER_URL}/${REPOSITORY}/compare/${PREVIOUS_TAG}...${RELEASE_TAG}"
            fi
            echo
            echo '---'
            echo
            if [[ -n "$RELEASE_SUMMARY" ]]; then
              printf '%s\n' "$RELEASE_SUMMARY"
            else
              echo '### Release Summary'
              echo
              echo 'No automated summary is available. Review the changelog above.'
            fi
          } > release-summary.md
      # ----
      - name: 'Generate repository-scoped release App token'
        id: release-app
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - name: 'Verify release App identity'
        env:
          ACTUAL_APP_SLUG: ${{ steps.release-app.outputs.app-slug }}
          EXPECTED_APP_SLUG: ${{ vars.RELEASE_APP_NAME }}
        run: |
          if [[ "$ACTUAL_APP_SLUG" != "$EXPECTED_APP_SLUG" ]]; then
            echo "Release App slug mismatch" >&2
            exit 1
          fi
      - name: 'Revalidate publication target'
        id: publication-state
        env:
          EXPECTED_APP_SLUG: ${{ vars.RELEASE_APP_NAME }}
          GH_TOKEN: ${{ steps.release-app.outputs.token }}
          IMAGE_DIGEST: ${{ needs.docker-build.outputs.image_digest }}
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/go42
          IS_PRERELEASE: ${{ needs.validate-release.outputs.is_prerelease }}
          RELEASE_TAG: ${{ needs.validate-release.outputs.release_tag }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ needs.validate-release.outputs.source_sha }}
        run: |
          set -euo pipefail

          current_digest="$(docker buildx imagetools inspect \
            "${IMAGE_REPOSITORY}:${RELEASE_TAG}" --format '{{json .}}' \
            | jq -r '.manifest.digest // empty')"
          if [[ "$current_digest" != "$IMAGE_DIGEST" ]]; then
            echo "Release image changed before Git publication" >&2
            exit 1
          fi

          tag_exists=false
          tag_error="${RUNNER_TEMP}/release-tag-query-error"
          set +e
          tag_ref="$(gh api "repos/${REPOSITORY}/git/ref/tags/${RELEASE_TAG}" 2> "$tag_error")"
          tag_exit=$?
          set -e
          if (( tag_exit == 0 )); then
            if ! jq -e \
              --arg ref "refs/tags/${RELEASE_TAG}" \
              --arg sha "$SOURCE_SHA" \
              '.ref == $ref and .object.type == "commit" and .object.sha == $sha' \
              <<< "$tag_ref" >/dev/null; then
              echo "Existing Git tag is not the expected lightweight release tag" >&2
              exit 1
            fi
            tag_exists=true
          elif ! grep -Fq 'HTTP 404' "$tag_error"; then
            cat "$tag_error" >&2
            exit "$tag_exit"
          fi

          release_exists=false
          release_error="${RUNNER_TEMP}/release-query-error"
          set +e
          existing_release="$(gh api "repos/${REPOSITORY}/releases/tags/${RELEASE_TAG}" 2> "$release_error")"
          release_exit=$?
          set -e
          if (( release_exit == 0 )); then
            if [[ "$tag_exists" != true ]] || ! jq -e \
              --arg author "${EXPECTED_APP_SLUG}[bot]" \
              --arg tag "$RELEASE_TAG" \
              --argjson prerelease "$IS_PRERELEASE" \
              '.tag_name == $tag
                and .name == ("Release " + $tag)
                and .author.login == $author
                and .draft == false
                and .prerelease == $prerelease' <<< "$existing_release" >/dev/null; then
              echo "Existing GitHub release conflicts with $RELEASE_TAG" >&2
              exit 1
            fi
            release_exists=true
          elif ! grep -Fq 'HTTP 404' "$release_error"; then
            cat "$release_error" >&2
            exit "$release_exit"
          fi

          {
            echo "release_exists=$release_exists"
            echo "tag_exists=$tag_exists"
          } >> "$GITHUB_OUTPUT"
      # ----
      # Publish the Git tag only after the matching container tag has been
      # pushed, tested by digest, and reverified immediately above.
      - name: 'Create immutable release tag'
        if: steps.publication-state.outputs.tag_exists == 'false'
        env:
          GH_TOKEN: ${{ steps.release-app.outputs.token }}
          RELEASE_TAG: ${{ needs.validate-release.outputs.release_tag }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ needs.validate-release.outputs.source_sha }}
        run: |
          set -euo pipefail
          jq -n \
            --arg ref "refs/tags/${RELEASE_TAG}" \
            --arg sha "$SOURCE_SHA" \
            '{ref: $ref, sha: $sha}' \
            | gh api --method POST "repos/${REPOSITORY}/git/refs" --input - >/dev/null
      - name: 'Create GitHub release'
        if: steps.publication-state.outputs.release_exists == 'false'
        env:
          GH_TOKEN: ${{ steps.release-app.outputs.token }}
          IS_PRERELEASE: ${{ needs.validate-release.outputs.is_prerelease }}
          RELEASE_TAG: ${{ needs.validate-release.outputs.release_tag }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ needs.validate-release.outputs.source_sha }}
        run: |
          set -euo pipefail
          payload="${RUNNER_TEMP}/release-payload.json"
          jq -n \
            --arg tag "$RELEASE_TAG" \
            --arg source_sha "$SOURCE_SHA" \
            --argjson prerelease "$IS_PRERELEASE" \
            --rawfile body release-summary.md \
            '{
              tag_name: $tag,
              target_commitish: $source_sha,
              name: ("Release " + $tag),
              body: $body,
              draft: false,
              prerelease: $prerelease,
              generate_release_notes: true,
              make_latest: (if $prerelease then "false" else "true" end)
            }' > "$payload"
          gh api --method POST "repos/${REPOSITORY}/releases" --input "$payload" >/dev/null
      - name: 'Verify published release'
        env:
          EXPECTED_APP_SLUG: ${{ vars.RELEASE_APP_NAME }}
          GH_TOKEN: ${{ steps.release-app.outputs.token }}
          IMAGE_DIGEST: ${{ needs.docker-build.outputs.image_digest }}
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/go42
          IS_PRERELEASE: ${{ needs.validate-release.outputs.is_prerelease }}
          RELEASE_TAG: ${{ needs.validate-release.outputs.release_tag }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ needs.validate-release.outputs.source_sha }}
        run: |-
          set -euo pipefail
          tag_ref="$(gh api "repos/${REPOSITORY}/git/ref/tags/${RELEASE_TAG}")"
          if ! jq -e \
            --arg ref "refs/tags/${RELEASE_TAG}" \
            --arg sha "$SOURCE_SHA" \
            '.ref == $ref and .object.type == "commit" and .object.sha == $sha' \
            <<< "$tag_ref" >/dev/null; then
            echo "Published Git tag is not the expected lightweight release tag" >&2
            exit 1
          fi

          published_release="$(gh api "repos/${REPOSITORY}/releases/tags/${RELEASE_TAG}")"
          if ! jq -e \
            --arg author "${EXPECTED_APP_SLUG}[bot]" \
            --arg tag "$RELEASE_TAG" \
            --argjson prerelease "$IS_PRERELEASE" \
            '.tag_name == $tag
              and .name == ("Release " + $tag)
              and .author.login == $author
              and .draft == false
              and .prerelease == $prerelease' <<< "$published_release" >/dev/null; then
            echo "Published GitHub release failed final verification" >&2
            exit 1
          fi

          current_digest="$(docker buildx imagetools inspect \
            "${IMAGE_REPOSITORY}:${RELEASE_TAG}" --format '{{json .}}' \
            | jq -r '.manifest.digest // empty')"
          if [[ "$current_digest" != "$IMAGE_DIGEST" ]]; then
            echo "Published container tag no longer points to the tested digest" >&2
            exit 1
          fi
