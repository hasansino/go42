---

name: sql-lint

# Linter for sql migrations.
# @see https://github.com/sqlfluff/sqlfluff

on:
  workflow_call:
    inputs:
      runs_on:
        required: true
        type: string
      continue_on_error:
        required: true
        type: boolean
      timeout_minutes:
        required: false
        type: number
        default: 10

permissions: {}

jobs:
  sql-lint:
    name: sql-lint (${{ matrix.database }})
    runs-on: ${{ inputs.runs_on }}
    continue-on-error: ${{ inputs.continue_on_error }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: read
    strategy:
      matrix:
        database:
          - sqlite
          - mysql
          - pgsql
        include:
          - database: sqlite
            dialect: sqlite
            path: migrate/sqlite/*.sql
          - database: mysql
            dialect: mysql
            path: migrate/mysql/*.sql
          - database: pgsql
            dialect: postgres
            path: migrate/pgsql/*.sql
    # -----
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # -----
      - name: 'Install SQLFluff'
        run: pip install sqlfluff
      - name: 'Run SQLFluff linter'
        run: sqlfluff lint --config etc/sqlfluff.toml ${{ matrix.path }} --dialect ${{ matrix.dialect }}
