---

name: sql-lint

# Linter for sql migrations.
# @see https://github.com/sqlfluff/sqlfluff

on:
  workflow_dispatch:
    inputs:
      runs_on:
        required: true
        type: string
        default: ubuntu-latest
        description: 'runs_on'
      continue_on_error:
        required: true
        type: boolean
        default: false
        description: 'continue_on_error'
      timeout_minutes:
        required: false
        type: number
        default: 10
        description: 'timeout_minutes'
  workflow_call:
    inputs:
      runs_on:
        required: true
        type: string
      continue_on_error:
        required: true
        type: boolean
      timeout_minutes:
        required: false
        type: number
        default: 10

permissions: {}

jobs:
  sql-lint:
    name: sql-lint (${{ matrix.database }})
    runs-on: ${{ inputs.runs_on }}
    continue-on-error: ${{ inputs.continue_on_error }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: read
    strategy:
      matrix:
        database:
          - sqlite
          - mysql
          - pgsql
        include:
          - database: sqlite
            dialect: sqlite
            path: migrate/sqlite/*.sql
          - database: mysql
            dialect: mysql
            path: migrate/mysql/*.sql
          - database: pgsql
            dialect: postgres
            path: migrate/pgsql/*.sql
    # -----
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@v7
      # -----
      - name: 'Install SQLFluff'
        run: pip install sqlfluff
      - name: 'Run SQLFluff linter'
        run: sqlfluff lint --config etc/sqlfluff.toml ${{ matrix.path }} --dialect ${{ matrix.dialect }}
