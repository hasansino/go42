---

name: release-policy

# pull_request_target loads this validator from the base repository's trusted
# default branch. Never checkout, source, or execute pull-request content here.
on:
  pull_request_target:
    types:
      - converted_to_draft
      - edited
      - opened
      - ready_for_review
      - reopened
      - synchronize

permissions: {}

concurrency:
  group: release-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  release-policy:
    # The ruleset requires the custom `release-policy` commit status published
    # below. The workflow check itself is deliberately named differently because
    # pull_request_target checks are attached to the default-branch commit.
    name: release-policy-validator
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      # Pull-request content is never checked out. This fetches only the helper
      # from the same trusted commit that supplied this workflow definition.
      - name: 'Checkout trusted release version helper'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          path: .trusted-release-policy
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
          sparse-checkout: .github/scripts/release-semver.py
          sparse-checkout-cone-mode: false
      - name: 'Evaluate release policy'
        env:
          EXPECTED_APP_SLUG: ${{ vars.RELEASE_APP_NAME }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RELEASE_APP_AUTHORED: >-
            ${{ vars.RELEASE_APP_NAME != '' && github.event.pull_request.user.login == format('{0}[bot]', vars.RELEASE_APP_NAME)
            }}
          REPOSITORY: ${{ github.repository }}
          SEMVER_TOOL: >-
            ${{ github.workspace }}/.trusted-release-policy/.github/scripts/release-semver.py
          STATUS_TARGET_URL: >-
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |-
          set -euo pipefail

          chart_file='infra/helm/app/Chart.yaml'
          final_description='Release policy validation failed.'
          status_context='release-policy'
          status_ready=false
          status_shas=()

          publish_one_status() {
            local sha="$1"
            local state="$2"
            local description="$3"

            gh api --method POST "repos/${REPOSITORY}/statuses/${sha}" \
              --raw-field state="$state" \
              --raw-field context="$status_context" \
              --raw-field description="$description" \
              --raw-field target_url="$STATUS_TARGET_URL" \
              >/dev/null
          }

          mark_pending_status() {
            local sha="$1"
            local existing_sha

            for existing_sha in "${status_shas[@]}"; do
              if [[ "$existing_sha" == "$sha" ]]; then
                return 0
              fi
            done

            status_shas+=("$sha")
            if ! publish_one_status \
              "$sha" 'pending' 'Evaluating release-controlled Helm metadata.'; then
              fail 'Could not publish a pending release-policy status'
            fi
          }

          publish_final_statuses() {
            local sha
            local status_exit=0

            if [[ "$status_ready" != 'true' ]]; then
              return 0
            fi

            if (( policy_exit != 0 )); then
              for sha in "${status_shas[@]}"; do
                if ! publish_one_status \
                  "$sha" 'failure' 'Release policy validation failed.'; then
                  status_exit=1
                fi
              done
              return "$status_exit"
            fi

            # Reject stale candidates before publishing success. HEAD is the
            # authorization consumed by the release workflow, so write it strictly
            # last with no later fallible work.
            for sha in "${status_shas[@]}"; do
              if [[ "$sha" != "$head_sha" && "$sha" != "$merge_sha" ]]; then
                if ! publish_one_status \
                  "$sha" 'failure' 'Stale test-merge candidate rejected.'; then
                  return 1
                fi
              fi
            done

            if [[ -n "$merge_sha" && "$merge_sha" != "$head_sha" ]] && \
              ! publish_one_status "$merge_sha" 'success' "$final_description"; then
              return 1
            fi
            publish_one_status "$head_sha" 'success' "$final_description"
          }

          finalize() {
            policy_exit=$?
            trap - EXIT

            if ! publish_final_statuses; then
              echo 'Failed to publish the final release-policy commit status' >&2
              policy_exit=1
            fi
            exit "$policy_exit"
          }

          fail() {
            echo "$1" >&2
            exit 1
          }

          not_applicable() {
            local current_pr_json="${work_dir}/pull-request-current.json"
            local current_merge_sha

            if ! gh api --method GET \
              "repos/${REPOSITORY}/pulls/${PR_NUMBER}" > "$current_pr_json"; then
              fail 'Could not confirm the final pull request state'
            fi
            if ! jq -e \
              --arg head "$head_sha" \
              --arg base "$base_sha" '
                .head.sha == $head
                and .base.sha == $base
              ' "$current_pr_json" >/dev/null; then
              fail 'Pull request changed while release policy was running'
            fi

            current_merge_sha="$(jq -r '.merge_commit_sha // empty' "$current_pr_json")"
            if [[ -n "$merge_sha" && "$current_merge_sha" != "$merge_sha" ]]; then
              fail 'Pull request test merge changed while release policy was running'
            fi
            if [[ -z "$merge_sha" && -n "$current_merge_sha" ]]; then
              if [[ ! "$current_merge_sha" =~ ^[0-9a-f]{40}$ ]]; then
                fail 'Pull request test-merge SHA has an unexpected format'
              fi
              mark_pending_status "$current_merge_sha"
              if ! verify_test_merge "$current_merge_sha" "$base_sha" "$head_sha"; then
                fail 'Newly available test merge could not be verified'
              fi
              merge_sha="$current_merge_sha"
            fi

            final_description='Not applicable: Chart appVersion is unchanged.'
            {
              echo '### Release policy'
              echo
              echo 'Not applicable: this pull request does not change the Chart appVersion.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }

          fetch_chart() {
            local repository="$1"
            local ref="$2"
            local output="$3"
            local response="${output}.json"

            gh api --method GET "repos/${repository}/contents/${chart_file}" \
              --raw-field ref="$ref" > "$response" || return 1
            jq -er '
              select(
                .type == "file"
                and .encoding == "base64"
                and (.size | type == "number")
                and .size <= 1048576
              )
              | .content
            ' "$response" | tr -d '\n' | base64 --decode > "$output"
          }

          verify_chart_blob() {
            local repository="$1"
            local ref="$2"
            local expected_blob="$3"
            local label="$4"
            local tree_json="${work_dir}/${label}-tree.json"

            if ! gh api --method GET "repos/${repository}/git/trees/${ref}" \
              --raw-field recursive=1 > "$tree_json"; then
              return 1
            fi
            jq -e \
              --arg chart "$chart_file" \
              --arg blob "$expected_blob" '
                (.tree | map(select(.path == $chart))) as $entries
                | .truncated == false
                  and ($entries | length) == 1
                  and $entries[0].mode == "100644"
                  and $entries[0].type == "blob"
                  and $entries[0].sha == $blob
              ' "$tree_json" >/dev/null
          }

          verify_test_merge() {
            local candidate_merge_sha="$1"
            local candidate_base_sha="$2"
            local candidate_head_sha="$3"
            local merge_commit_json="${work_dir}/merge-commit-${candidate_merge_sha}.json"

            gh api --method GET \
              "repos/${REPOSITORY}/commits/${candidate_merge_sha}" > "$merge_commit_json" && \
              jq -e \
                --arg merge "$candidate_merge_sha" \
                --arg base "$candidate_base_sha" \
                --arg head "$candidate_head_sha" '
                  .sha == $merge
                  and (.parents | length) == 2
                  and ([.parents[].sha] | sort) == ([$base, $head] | sort)
                ' "$merge_commit_json" >/dev/null
          }

          require_absent() {
            local endpoint="$1"
            local object_name="$2"
            local error_file="${work_dir}/api-error"

            if gh api --method GET "$endpoint" >/dev/null 2> "$error_file"; then
              fail "${object_name} already exists"
            fi
            if ! grep -Fq '(HTTP 404)' "$error_file"; then
              cat "$error_file" >&2
              fail "Could not safely determine whether ${object_name} exists"
            fi
          }

          require_no_visible_release() {
            local release_pages="${work_dir}/release-pages.json"
            local releases_json="${work_dir}/releases.json"

            if ! gh api --paginate \
              "repos/${REPOSITORY}/releases?per_page=100" > "$release_pages"; then
              fail 'Could not list GitHub releases'
            fi
            if ! jq -cs 'add // []' "$release_pages" > "$releases_json"; then
              fail 'GitHub release list is not valid JSON'
            fi
            if ! jq -e --arg tag "$release_tag" \
              'all(.[]; .tag_name != $tag)' "$releases_json" >/dev/null; then
              fail "GitHub release ${release_tag} already exists"
            fi
          }

          if [[ ! "$REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            fail 'Repository name has an unexpected format'
          fi
          if [[ ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            fail 'Pull request number has an unexpected format'
          fi

          work_dir="$(mktemp -d "${RUNNER_TEMP}/release-policy.XXXXXX")"
          pr_json="${work_dir}/pull-request.json"
          if ! gh api --method GET "repos/${REPOSITORY}/pulls/${PR_NUMBER}" > "$pr_json"; then
            fail 'Could not read the pull request through the GitHub API'
          fi

          head_sha="$(jq -er '.head.sha' "$pr_json")"
          if [[ ! "$head_sha" =~ ^[0-9a-f]{40}$ ]]; then
            fail 'Pull request head SHA has an unexpected format'
          fi

          status_ready=true
          trap finalize EXIT

          # Replace any prior test-merge success as early as possible. A candidate
          # that proves stale remains pending/failure; only a parent-verified
          # current candidate can receive success.
          initial_merge_sha="$(jq -r '.merge_commit_sha // empty' "$pr_json")"
          if [[ "$initial_merge_sha" =~ ^[0-9a-f]{40}$ ]]; then
            mark_pending_status "$initial_merge_sha"
          fi
          mark_pending_status "$head_sha"

          # GitHub may still be computing the synthetic test merge. Poll briefly,
          # and accept it only when its parents are the current base and head.
          merge_sha=''
          for attempt in $(seq 1 6); do
            if ! gh api --method GET "repos/${REPOSITORY}/pulls/${PR_NUMBER}" > "$pr_json"; then
              fail 'Could not refresh the pull request through the GitHub API'
            fi

            current_head_sha="$(jq -er '.head.sha' "$pr_json")"
            base_sha="$(jq -er '.base.sha' "$pr_json")"
            candidate_merge_sha="$(jq -r '.merge_commit_sha // empty' "$pr_json")"
            if [[ "$current_head_sha" != "$head_sha" ]]; then
              fail 'Pull request head changed while release policy was running'
            fi
            if [[ ! "$base_sha" =~ ^[0-9a-f]{40}$ ]]; then
              fail 'Pull request base SHA has an unexpected format'
            fi

            if [[ "$candidate_merge_sha" =~ ^[0-9a-f]{40}$ ]]; then
              mark_pending_status "$candidate_merge_sha"
              if verify_test_merge "$candidate_merge_sha" "$base_sha" "$head_sha"; then
                merge_sha="$candidate_merge_sha"
                break
              fi
            fi

            if (( attempt < 6 )); then
              sleep 2
            fi
          done
          if [[ -z "$merge_sha" ]]; then
            echo 'No current, verifiable test-merge commit is available' >&2
          else
            mark_pending_status "$merge_sha"
          fi

          snapshot_json="${work_dir}/pull-request-snapshot.json"
          cp "$pr_json" "$snapshot_json"

          # Unified CI recognizes this reserved branch shape before inspecting
          # files. Such a PR must never receive a not-applicable policy result.
          head_ref="$(jq -er '.head.ref' "$pr_json")"
          release_shaped=false
          # GitHub expression string functions are case-insensitive, so match
          # gate-start's branch classification before enforcing canonical case.
          # The same expression engine identifies Release App authors, closing
          # differences between GitHub expression and shell case handling.
          if [[ "${head_ref,,}" == auto-release-v* || "$RELEASE_APP_AUTHORED" == 'true' ]]; then
            release_shaped=true
          fi

          changed_files="$(jq -er '.changed_files' "$pr_json")"
          if [[ ! "$changed_files" =~ ^[0-9]+$ ]] || (( changed_files > 3000 )); then
            fail 'Pull request file list cannot be validated safely'
          fi

          files_pages="${work_dir}/files-pages.json"
          files_json="${work_dir}/files.json"
          if ! gh api --paginate \
            "repos/${REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" > "$files_pages"; then
            fail 'Could not read the pull request file list'
          fi
          if ! jq -cs 'add // []' "$files_pages" > "$files_json"; then
            fail 'Pull request file list is not valid JSON'
          fi
          listed_files="$(jq -r 'length' "$files_json")"
          if [[ "$listed_files" != "$changed_files" ]]; then
            fail 'GitHub returned an incomplete pull request file list'
          fi

          chart_entries="${work_dir}/chart-entries.json"
          jq --arg chart "$chart_file" '
            [
              .[]
              | select(
                  .filename == $chart
                  or (.previous_filename // "") == $chart
                )
            ]
          ' "$files_json" > "$chart_entries"
          chart_entry_count="$(jq -r 'length' "$chart_entries")"
          if [[ "$chart_entry_count" == '0' ]]; then
            if [[ "$release_shaped" == true ]]; then
              fail 'A release-shaped pull request must modify Chart appVersion'
            fi
            not_applicable
          fi
          if [[ "$chart_entry_count" != '1' ]]; then
            fail 'Chart path changes are ambiguous and cannot be validated safely'
          fi

          head_repository="$(jq -er '.head.repo.full_name' "$pr_json")"
          if [[ ! "$head_repository" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            fail 'Pull request head repository has an unexpected format'
          fi

          comparison_json="${work_dir}/comparison.json"
          if ! gh api --method GET \
            "repos/${REPOSITORY}/compare/${base_sha}...${head_sha}" > "$comparison_json"; then
            fail 'Could not determine the pull request merge base'
          fi
          merge_base_sha="$(jq -er '.merge_base_commit.sha' "$comparison_json")"
          if [[ ! "$merge_base_sha" =~ ^[0-9a-f]{40}$ ]]; then
            fail 'Pull request merge-base SHA has an unexpected format'
          fi

          base_chart="${work_dir}/base-Chart.yaml"
          head_chart="${work_dir}/head-Chart.yaml"
          if ! fetch_chart "$REPOSITORY" "$merge_base_sha" "$base_chart"; then
            fail 'Could not read the merge-base Chart.yaml through the GitHub API'
          fi
          if ! fetch_chart "$head_repository" "$head_sha" "$head_chart"; then
            fail 'Chart.yaml was removed or could not be read through the GitHub API'
          fi

          base_app_lines="${work_dir}/base-appVersion-lines"
          head_app_lines="${work_dir}/head-appVersion-lines"
          awk '/^appVersion:/{print}' "$base_chart" > "$base_app_lines"
          awk '/^appVersion:/{print}' "$head_chart" > "$head_app_lines"
          if cmp -s "$base_app_lines" "$head_app_lines"; then
            if [[ "$release_shaped" == true ]]; then
              fail 'A release-shaped pull request must change Chart appVersion'
            fi
            not_applicable
          fi
          if [[ -z "$merge_sha" ]]; then
            fail 'A release-controlled change requires a current, verifiable test merge'
          fi

          pr_commit_count="$(jq -er '.commits' "$pr_json")"
          if [[ "$changed_files" != '1' || "$pr_commit_count" != '1' ]]; then
            fail 'Release pull request must contain exactly one file and one commit'
          fi

          if [[ ! "$EXPECTED_APP_SLUG" =~ ^[a-z0-9][a-z0-9-]{0,99}$ ]]; then
            fail 'RELEASE_APP_NAME must contain the release App slug'
          fi
          expected_bot="${EXPECTED_APP_SLUG}[bot]"
          pr_author="$(jq -er '.user.login' "$pr_json")"
          pr_author_type="$(jq -er '.user.type' "$pr_json")"
          pr_base="$(jq -er '.base.ref' "$pr_json")"
          base_repository="$(jq -er '.base.repo.full_name' "$pr_json")"
          pr_title="$(jq -er '.title' "$pr_json")"

          if [[ "$pr_author" != "$expected_bot" || "$pr_author_type" != 'Bot' ]]; then
            fail 'Chart appVersion may be changed only by the configured release App'
          fi
          if [[ "$head_repository" != "$REPOSITORY" || "$base_repository" != "$REPOSITORY" ]]; then
            fail 'A release pull request must originate in this repository'
          fi
          if [[ "$pr_base" != 'master' ]]; then
            fail 'A release pull request must target master'
          fi

          release_tag="${head_ref#auto-release-}"
          if ! python3 "$SEMVER_TOOL" validate "$release_tag"; then
            fail 'Release branch must contain strict SemVer without build metadata'
          fi
          if [[ "$head_ref" != "auto-release-${release_tag}" ]]; then
            fail 'Release branch name is not deterministic'
          fi
          if [[ "$pr_title" != "Release ${release_tag}" ]]; then
            fail 'Release pull request title does not match its version'
          fi

          if ! jq -e --arg chart "$chart_file" '
            length == 1
            and .[0].filename == $chart
            and .[0].status == "modified"
            and .[0].additions == 1
            and .[0].deletions == 1
            and ((.[0].previous_filename // "") == "")
          ' "$chart_entries" >/dev/null; then
            fail 'Release pull request must modify exactly one Chart.yaml line in place'
          fi

          base_app_count="$(awk '/^appVersion:/{count++} END{print count + 0}' "$base_chart")"
          head_app_count="$(awk '/^appVersion:/{count++} END{print count + 0}' "$head_chart")"
          if [[ "$base_app_count" != '1' || "$head_app_count" != '1' ]]; then
            fail 'Chart.yaml must contain exactly one top-level appVersion line'
          fi

          base_app_line_number="$(awk '/^appVersion:/{print NR}' "$base_chart")"
          head_app_line_number="$(awk '/^appVersion:/{print NR}' "$head_chart")"
          base_app_line="$(sed -n "${base_app_line_number}p" "$base_chart")"
          head_app_line="$(sed -n "${head_app_line_number}p" "$head_chart")"
          if [[ "$base_app_line_number" != "$head_app_line_number" || \
            "$base_app_line" == "$head_app_line" ]]; then
            fail 'Release pull request must replace exactly one appVersion line in place'
          fi
          if [[ "$head_app_line" != "appVersion: \"${release_tag}\"" ]]; then
            fail 'Resulting Chart appVersion does not equal the release tag'
          fi

          base_version="$(sed -n 's/^appVersion: "\([^"]*\)"$/\1/p' "$base_chart")"
          if ! python3 "$SEMVER_TOOL" validate "$base_version"; then
            fail 'Merge-base Chart appVersion is not supported strict SemVer'
          fi

          published_names_file="${work_dir}/published-release-names"
          if ! gh api --paginate "repos/${REPOSITORY}/releases?per_page=100" \
            --jq '.[] | select(.draft == false) | .tag_name' > "$published_names_file"; then
            fail 'Could not list published GitHub releases'
          fi

          if ! published_baseline="$(
            python3 "$SEMVER_TOOL" prepare \
              "$release_tag" \
              "$base_version" \
              "$published_names_file"
          )"; then
            fail 'Release transition is inconsistent with repository publication state'
          fi

          base_chart_blob="$(jq -er '.sha' "${base_chart}.json")"
          head_chart_blob="$(jq -er '.sha' "${head_chart}.json")"
          if [[ ! "$base_chart_blob" =~ ^[0-9a-f]{40}$ || \
            ! "$head_chart_blob" =~ ^[0-9a-f]{40}$ ]]; then
            fail 'Chart.yaml blob SHA has an unexpected format'
          fi
          if ! verify_chart_blob \
            "$REPOSITORY" "$merge_base_sha" "$base_chart_blob" 'base'; then
            fail 'Merge-base Chart.yaml must be a regular non-executable file'
          fi
          if ! verify_chart_blob \
            "$head_repository" "$head_sha" "$head_chart_blob" 'head'; then
            fail 'Release Chart.yaml must remain a regular non-executable file'
          fi

          base_without_app="${work_dir}/base-without-appVersion"
          head_without_app="${work_dir}/head-without-appVersion"
          sed "${base_app_line_number}d" "$base_chart" > "$base_without_app"
          sed "${head_app_line_number}d" "$head_chart" > "$head_without_app"
          if ! cmp -s "$base_without_app" "$head_without_app"; then
            fail 'Release pull request changed Chart.yaml outside appVersion'
          fi

          repository_owner="${REPOSITORY%%/*}"
          repository_name="${REPOSITORY#*/}"
          signature_json="${work_dir}/head-signature.json"
          # shellcheck disable=SC2016 # GraphQL variables are intentionally literal.
          if ! gh api graphql \
            -f query='query($owner:String!,$name:String!,$oid:GitObjectID!){repository(owner:$owner,name:$name){object(oid:$oid){__typename ... on Commit{oid author{user{login}} parents(first:2){totalCount nodes{oid}} signature{isValid state wasSignedByGitHub signer{login}}}}}}' \
            -F owner="$repository_owner" \
            -F name="$repository_name" \
            -F oid="$head_sha" > "$signature_json"; then
            fail 'Could not verify the release commit signature through the GitHub API'
          fi
          # `sign-commits: true` App commits are attributed to APP[bot] and
          # signed with GitHub's key. GraphQL exposes both properties directly.
          if ! jq -e \
            --arg sha "$head_sha" \
            --arg author "$expected_bot" \
            --arg parent "$merge_base_sha" '
              .data.repository.object as $commit
              | $commit.__typename == "Commit"
                and $commit.oid == $sha
                and $commit.author.user.login == $author
                and $commit.parents.totalCount == 1
                and $commit.parents.nodes[0].oid == $parent
                and $commit.signature.isValid == true
                and $commit.signature.state == "VALID"
                and $commit.signature.wasSignedByGitHub == true
                and $commit.signature.signer.login == "web-flow"
            ' "$signature_json" >/dev/null; then
            fail 'Release head commit is not App-authored and GitHub-signed'
          fi

          require_absent \
            "repos/${REPOSITORY}/git/ref/tags/${release_tag}" \
            "Git tag ${release_tag}"
          require_absent \
            "repos/${REPOSITORY}/releases/tags/${release_tag}" \
            "Published GitHub release ${release_tag}"
          # The list endpoint also returns drafts when the workflow token has
          # sufficient repository visibility; the by-tag endpoint is published-only.
          require_no_visible_release

          current_pr_json="${work_dir}/pull-request-current.json"
          if ! gh api --method GET "repos/${REPOSITORY}/pulls/${PR_NUMBER}" > "$current_pr_json"; then
            fail 'Could not confirm the final pull request state'
          fi
          if ! jq -s -e '
            .[0] as $before
            | .[1] as $after
            | $before.head.sha == $after.head.sha
              and $before.base.sha == $after.base.sha
              and $before.merge_commit_sha == $after.merge_commit_sha
              and $before.head.ref == $after.head.ref
              and $before.head.repo.full_name == $after.head.repo.full_name
              and $before.base.ref == $after.base.ref
              and $before.title == $after.title
              and $before.user.login == $after.user.login
          ' "$snapshot_json" "$current_pr_json" >/dev/null; then
            fail 'Pull request changed while release policy was running'
          fi

          final_description="Authorized release PR #${PR_NUMBER} validated."
          {
            echo '### Release policy'
            echo
            echo "Authorized release pull request for \`${release_tag}\`."
            echo "Published release baseline: \`${published_baseline}\`."
          } >> "$GITHUB_STEP_SUMMARY"
      # A failure before the evaluator starts (for example, checkout failure)
      # must still conclude the custom status required by the ruleset.
      - name: 'Publish fallback release-policy failure'
        if: ${{ failure() }}
        env:
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          STATUS_TARGET_URL: >-
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |-
          set -euo pipefail
          status_shas=()
          for sha in "$EVENT_HEAD_SHA" "$EVENT_MERGE_SHA"; do
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || continue
            [[ " ${status_shas[*]} " == *" ${sha} "* ]] && continue
            status_shas+=("$sha")
          done
          for sha in "${status_shas[@]}"; do
            gh api --method POST "repos/${REPOSITORY}/statuses/${sha}" \
              --raw-field state='failure' \
              --raw-field context='release-policy' \
              --raw-field description='Release policy workflow failed.' \
              --raw-field target_url="$STATUS_TARGET_URL" \
              >/dev/null
          done
