---

name: proto-lint

# Protobuf linter.
# @see https://buf.build/docs/lint/

on:
  workflow_call:
    inputs:
      runs_on:
        required: true
        type: string
      continue_on_error:
        required: true
        type: boolean
      timeout_minutes:
        required: false
        type: number
        default: 10

permissions: {}

jobs:
  proto-lint:
    name: proto-lint
    runs-on: ${{ inputs.runs_on }}
    continue-on-error: ${{ inputs.continue_on_error }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: read
    # ----
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@v7
      - name: 'Run buf lint and format'
        uses: bufbuild/buf-action@v1
        with:
          version: 1.55.0
          input: api
          lint: true
          format: true
          pr_comment: false
