---

name: dep-submission

# Manually submits Go dependencies to GitHub's dependency graph.
# Automatic submissions are handled by GitHub's managed Dependency Graph job.

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: dep-submission-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dep-submission:
    name: dep-submission
    if: |
      github.ref == 'refs/heads/master' &&
      github.event.head_commit.message != 'initial commit' &&
      !startsWith(github.event.head_commit.message, 'auto-release-')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@v7
      - name: 'Setup Go environment'
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
      - name: 'Submit Go dependencies to GitHub'
        uses: actions/go-dependency-submission@v2
        with:
          go-mod-path: go.mod
          go-build-target: cmd/app/main.go
